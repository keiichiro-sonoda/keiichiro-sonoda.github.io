# gh-pages に push したら、Astro でビルドし、成果物を公開前検査にかけてから GitHub Pages に公開する。
#
# 前提（リポジトリの設定。一度だけ）:
# - Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
# - Settings → Environments → github-pages の Deployment branches に gh-pages を足す
#   （既定のブランチ main しか許されていないと、公開の段で止まる）
# - Settings → Secrets and variables → Actions に PUBLISH_DENY_WORDS（公開しない言葉。1行に1語）を Web の画面で置く。
#   無ければ検査できないので公開しない（tools/publish_lint.py の終了コード 2）
#
# アクションはタグではなくコミットの SHA で固定する（タグは付け替えられる。polyfill.io と同じ理由）。
name: Deploy

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: 成果物の公開前検査
        env:
          DENY_WORDS: ${{ secrets.PUBLISH_DENY_WORDS }}
        run: |
          deny="$RUNNER_TEMP/deny.txt"
          printf '%s\n' "$DENY_WORDS" > "$deny"
          PUBLISH_DENY="$deny" python3 tools/publish_lint.py --dir dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
